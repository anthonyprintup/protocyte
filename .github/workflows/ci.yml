name: CI

on:
  workflow_call:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: CI-${{ github.ref }}
  cancel-in-progress: true

jobs:
  private-path-guard:
    name: Private Path Guard
    runs-on: ubuntu-latest

    steps:
      - name: Check out complete repository history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Reject private absolute paths
        run: python .github/scripts/check_private_paths.py

  protobuf-fallback:
    name: Protobuf Fallback
    uses: ./.github/workflows/protobuf-fallback.yml

  protobuf-floor:
    name: Protobuf Floor
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - name: Install the public protobuf floor outside the lockfile
        run: |
          uv venv build/protobuf-floor-venv --python 3.12
          uv pip install --python build/protobuf-floor-venv/bin/python --no-deps .
          uv pip install --python build/protobuf-floor-venv/bin/python "protobuf==6.30.0" "pytest==8.4.2"
          build/protobuf-floor-venv/bin/python -c 'import google.protobuf; assert google.protobuf.__version__ == "6.30.0"'

      - name: Generate with the protobuf floor (upb)
        env:
          PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: upb
          PROTOCYTE_EXPECTED_PROTOBUF_VERSION: "6.30.0"
        run: build/protobuf-floor-venv/bin/python -m pytest -q tests/test_protobuf_floor.py

      - name: Generate with the protobuf floor (pure Python)
        env:
          PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
          PROTOCYTE_EXPECTED_PROTOBUF_VERSION: "6.30.0"
        run: build/protobuf-floor-venv/bin/python -m pytest -q tests/test_protobuf_floor.py

  plugin:
    name: Plugin (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --group dev

      - name: Install prebuilt protoc for required CMake integrations
        if: matrix.python-version == '3.12'
        id: integration-protoc
        run: python .github/scripts/install_protoc.py --dest "${{ runner.temp }}/protoc"

      - name: Lint Python sources
        run: uv run ruff check src tests

      - name: Build plugin package
        run: uv build

      - name: Run plugin tests
        env:
          PROTOCYTE_CI_PROTOC_EXECUTABLE: ${{ steps.integration-protoc.outputs.protoc }}
          PROTOCYTE_CI_REQUIRE_REAL_PROTOC_TESTS: ${{ matrix.python-version == '3.12' && '1' || '0' }}
        run: uv run pytest -q

  quickstart-linux:
    name: Quick Start Linux
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - name: Install prebuilt protoc
        id: protoc
        run: python .github/scripts/install_protoc.py --dest "${{ runner.temp }}/protoc"

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build

      - name: Build plugin wheel
        run: uv build --wheel

      - name: Install plugin wheel in an isolated environment
        run: |
          uv venv build/quickstart-venv --python 3.12
          uv pip install --python build/quickstart-venv/bin/python dist/*.whl

      - name: Verify installed CLI entry points
        run: |
          build/quickstart-venv/bin/protoc-gen-protocyte --help
          build/quickstart-venv/bin/protoc-gen-protocyte --version
          build/quickstart-venv/bin/python -m protocyte --help
          build/quickstart-venv/bin/python -m protocyte --version

      - name: Configure quick-start example
        run: >
          cmake -S examples/quickstart -B build/quickstart
          "-DPROTOC_EXECUTABLE=${{ steps.protoc.outputs.protoc }}"
          "-DPROTOCYTE_PLUGIN_EXECUTABLE=${{ github.workspace }}/build/quickstart-venv/bin/protoc-gen-protocyte"

      - name: Generate and build quick-start example
        run: cmake --build build/quickstart

      - name: Run quick-start round trip
        run: ctest --test-dir build/quickstart --output-on-failure

      - name: Verify incremental ownership, relocation, and multi-config generation
        env:
          PROTOCYTE_CI_PROTOC_EXECUTABLE: ${{ steps.protoc.outputs.protoc }}
          PROTOCYTE_CI_REQUIRE_INCREMENTAL_TEST: "1"
          PROTOCYTE_CI_REQUIRE_INSTALL_EXPORT_TEST: "1"
          PROTOCYTE_CI_REQUIRE_MULTICONFIG_LOCKING_TEST: "1"
        run: >
          uv run pytest -q
          tests/test_cmake.py::test_source_codegen_regenerates_when_transitive_import_changes
          tests/test_cmake.py::test_source_discover_removes_only_outputs_owned_by_a_renamed_proto
          tests/test_cmake.py::test_descriptor_discover_removes_only_outputs_owned_by_a_deleted_file
          tests/test_cmake.py::test_owned_output_cleanup_preserves_files_transferred_between_targets
          tests/test_cmake.py::test_multiconfig_codegen_serializes_shared_outputs_between_build_processes
          tests/test_cmake.py::test_proto_library_installs_exports_and_reconsumes_from_relocated_prefix

  quickstart-windows:
    name: Quick Start Windows
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - name: Install prebuilt protoc
        id: protoc
        run: python .github/scripts/install_protoc.py --dest "${{ runner.temp }}/protoc"

      - name: Build plugin wheel
        run: uv build --wheel

      - name: Install plugin wheel in an isolated environment
        run: |
          uv venv build/quickstart-venv --python 3.12
          $wheel = (Get-ChildItem dist/protocyte-*.whl | Sort-Object LastWriteTime -Descending | Select-Object -First 1).FullName
          uv pip install --python build/quickstart-venv/Scripts/python.exe $wheel

      - name: Verify installed CLI entry points
        run: |
          & build/quickstart-venv/Scripts/protoc-gen-protocyte.exe --help
          & build/quickstart-venv/Scripts/protoc-gen-protocyte.exe --version
          & build/quickstart-venv/Scripts/python.exe -m protocyte --help
          & build/quickstart-venv/Scripts/python.exe -m protocyte --version

      - name: Set up MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Configure quick-start example
        run: >
          cmake -S examples/quickstart -B build/quickstart
          "-DPROTOC_EXECUTABLE=${{ steps.protoc.outputs.protoc }}"
          "-DPROTOCYTE_PLUGIN_EXECUTABLE=${{ github.workspace }}/build/quickstart-venv/Scripts/protoc-gen-protocyte.exe"

      - name: Generate and build quick-start example
        run: cmake --build build/quickstart --config Release

      - name: Run quick-start round trip
        run: ctest --test-dir build/quickstart -C Release --output-on-failure

  quickstart-macos:
    name: Quick Start macOS
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - name: Install prebuilt protoc
        id: protoc
        run: python .github/scripts/install_protoc.py --dest "${{ runner.temp }}/protoc"

      - name: Build plugin wheel
        run: uv build --wheel

      - name: Install plugin wheel in an isolated environment
        run: |
          uv venv build/quickstart-venv --python 3.12
          uv pip install --python build/quickstart-venv/bin/python dist/*.whl

      - name: Verify installed CLI entry points
        run: |
          build/quickstart-venv/bin/protoc-gen-protocyte --help
          build/quickstart-venv/bin/protoc-gen-protocyte --version
          build/quickstart-venv/bin/python -m protocyte --help
          build/quickstart-venv/bin/python -m protocyte --version

      - name: Configure quick-start example
        run: >
          cmake -S examples/quickstart -B build/quickstart
          -DCMAKE_BUILD_TYPE=Release
          "-DPROTOC_EXECUTABLE=${{ steps.protoc.outputs.protoc }}"
          "-DPROTOCYTE_PLUGIN_EXECUTABLE=${{ github.workspace }}/build/quickstart-venv/bin/protoc-gen-protocyte"

      - name: Generate and build quick-start example
        run: cmake --build build/quickstart

      - name: Run quick-start round trip
        run: ctest --test-dir build/quickstart --output-on-failure

  smoke-host:
    name: Smoke Host (clang-cl)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --group dev

      - name: Verify generated-output containment at the CMake floor
        run: >
          uv run --with cmake==3.24.3 pytest -q
          tests/test_cmake.py::test_generation_rejects_nested_output_directory_links
          tests/test_cmake.py::test_retirement_rejects_nested_output_directory_links
          tests/test_cmake.py::test_retirement_rechecks_containment_immediately_before_removal
          tests/test_cmake.py::test_unsafe_current_output_reconfigure_preserves_cleanup_fingerprints

      - name: Install prebuilt protoc for Windows argument transport
        id: windows-protoc
        run: python .github/scripts/install_protoc.py --dest "${{ runner.temp }}/protoc"

      - name: Verify prebuilt protoc UTF-8 response-file transport
        env:
          PROTOCYTE_CI_PROTOC_EXECUTABLE: ${{ steps.windows-protoc.outputs.protoc }}
          PROTOCYTE_CI_REQUIRE_WINDOWS_TRANSPORT_TEST: "1"
        run: >
          uv run pytest -q
          tests/test_cmake.py::test_prebuilt_windows_protoc_receives_utf8_descriptor_arguments
          tests/test_cmake.py::test_source_mode_codegen_declares_normalized_generated_paths

      - name: Verify checked smoke outputs
        env:
          PROTOCYTE_SMOKE_PROTOC: ${{ steps.windows-protoc.outputs.protoc }}
          PROTOCYTE_SMOKE_PROTOBUF_IMPORT_DIR: ${{ steps.windows-protoc.outputs.include }}
          PROTOCYTE_SMOKE_PLUGIN: ${{ github.workspace }}/.venv/Scripts/protoc-gen-protocyte.exe
          PROTOCYTE_SMOKE_CLANG_FORMAT: ${{ github.workspace }}/.venv/Scripts/clang-format.exe
        run: |
          uv run python tests/smoke/tools/generate_checked_outputs.py
          git diff --exit-code -- tests/smoke/generated
          if ($LASTEXITCODE -ne 0) {
              throw "Tracked smoke outputs differ from canonical regeneration"
          }
          uv run python .github/scripts/verify_tracked_tree.py tests/smoke/generated

      - name: Set up MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Verify generated library install and relocation
        env:
          PROTOCYTE_CI_PROTOC_EXECUTABLE: ${{ steps.windows-protoc.outputs.protoc }}
          PROTOCYTE_CI_REQUIRE_INSTALL_EXPORT_TEST: "1"
        run: >
          uv run pytest -q
          tests/test_cmake.py::test_proto_library_installs_exports_and_reconsumes_from_relocated_prefix

      - name: Configure non-kernel smoke tests
        working-directory: tests/smoke
        run: cmake --preset windows-clangcl-ninja

      - name: Build non-kernel smoke tests
        working-directory: tests/smoke
        run: cmake --build --preset windows-clangcl-ninja

      - name: Run non-kernel smoke tests
        working-directory: tests/smoke
        run: ctest --preset windows-clangcl-ninja

  smoke-host-msvc:
    name: Smoke Host (MSVC)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --group dev

      - name: Install prebuilt protoc for MSVC shared reflection
        id: windows-msvc-protoc
        run: python .github/scripts/install_protoc.py --dest "${{ runner.temp }}/protoc"

      - name: Set up MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Verify MSVC shared-library reflection exports
        env:
          PROTOCYTE_CI_PROTOC_EXECUTABLE: ${{ steps.windows-msvc-protoc.outputs.protoc }}
          PROTOCYTE_CI_REQUIRE_WINDOWS_SHARED_REFLECTION_TEST: "1"
        run: >
          uv run pytest -q
          tests/test_cmake.py::test_msvc_shared_library_exports_reflection_to_consumer

      - name: Configure non-kernel smoke tests
        working-directory: tests/smoke
        run: cmake --preset windows-msvc-ninja

      - name: Build non-kernel smoke tests
        working-directory: tests/smoke
        run: cmake --build --preset windows-msvc-ninja

      - name: Run non-kernel smoke tests
        working-directory: tests/smoke
        run: ctest --preset windows-msvc-ninja

  visual-studio-incremental:
    name: Visual Studio Codegen Incremental
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --group dev

      - name: Set up MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Install prebuilt protoc
        id: visual-studio-protoc
        run: python .github/scripts/install_protoc.py --dest "${{ runner.temp }}/protoc"

      - name: Verify Visual Studio configure, build, no-op, and rebuild
        env:
          PROTOCYTE_CI_PROTOC_EXECUTABLE: ${{ steps.visual-studio-protoc.outputs.protoc }}
          PROTOCYTE_CI_REQUIRE_REAL_PROTOC_TESTS: "1"
          PROTOCYTE_CI_REQUIRE_VISUAL_STUDIO_TEST: "1"
          PROTOCYTE_CI_VISUAL_STUDIO_TEST_ROOT: ${{ github.workspace }}/build/visual-studio-incremental
        run: >
          uv run pytest -q
          tests/test_cmake.py::test_visual_studio_codegen_builds_noop_and_rebuilds_transitive_import
          "tests/test_cmake.py::test_source_codegen_tracks_import_shadow_addition_and_removal[visual-studio]"
          "tests/test_cmake.py::test_source_codegen_tracks_import_directory_identity_changes[visual-studio]"
          "tests/test_cmake.py::test_source_codegen_tracks_import_directory_identity_changes[nmake]"

  smoke-host-linux:
    name: Smoke Host Linux
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Configure Linux smoke tests
        run: cmake -S tests/smoke -B tests/smoke/build/linux-host -G Ninja

      - name: Build Linux smoke tests
        run: cmake --build tests/smoke/build/linux-host

      - name: Run Linux smoke tests
        run: ctest --test-dir tests/smoke/build/linux-host --output-on-failure

  smoke-kernel-build:
    name: Smoke Kernel Build
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --group dev

      - name: Set up MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Configure kernel smoke build
        working-directory: tests/smoke
        run: cmake --preset windows-msvc-ninja-driver

      - name: Build kernel smoke target
        working-directory: tests/smoke
        run: cmake --build --preset windows-msvc-ninja-driver --target protocyte_kernel_smoke

  fetchcontent-linux:
    name: FetchContent Linux
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install prebuilt protoc
        id: protoc
        run: python .github/scripts/install_protoc.py --dest "${{ runner.temp }}/protoc"

      - name: Configure FetchContent integration test
        run: >
          cmake -S tests/fetchcontent -B tests/fetchcontent/build
          -DProtobuf_PROTOC_EXECUTABLE=${{ steps.protoc.outputs.protoc }}

      - name: Build FetchContent integration test
        run: cmake --build tests/fetchcontent/build

      - name: Run FetchContent integration test
        run: ctest --test-dir tests/fetchcontent/build --output-on-failure

      - name: Install FetchContent consumer
        run: >
          cmake --install tests/fetchcontent/build
          --prefix tests/fetchcontent/install

      - name: Verify FetchContent install isolation
        run: |
          test -f tests/fetchcontent/install/share/protocyte-integration/fetchcontent-consumer.txt
          test "$(wc -l < tests/fetchcontent/build/install_manifest.txt)" -eq 1
          test ! -e tests/fetchcontent/install/include/protocyte
          test ! -e tests/fetchcontent/install/lib/cmake/protocyte
          test ! -e tests/fetchcontent/install/share/protocyte

  find-package-linux:
    name: Find Package Linux
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install prebuilt protoc
        id: protoc
        run: python .github/scripts/install_protoc.py --dest "${{ runner.temp }}/protoc"

      - name: Configure protocyte install tree
        run: cmake -S . -B build/protocyte-install

      - name: Install protocyte package
        run: cmake --install build/protocyte-install --prefix build/protocyte-prefix

      - name: Make installed prefix read-only
        run: chmod -R a-w build/protocyte-prefix

      - name: Configure find_package integration test
        run: >
          cmake -S tests/find_package -B tests/find_package/build
          -DCMAKE_PREFIX_PATH=${{ github.workspace }}/build/protocyte-prefix
          -DProtobuf_PROTOC_EXECUTABLE=${{ steps.protoc.outputs.protoc }}

      - name: Build find_package integration test
        run: cmake --build tests/find_package/build

      - name: Run find_package integration test
        run: ctest --test-dir tests/find_package/build --output-on-failure

      - name: Verify provisioning did not modify the installed prefix
        run: |
          test ! -e build/protocyte-prefix/share/protocyte/python/build
          test ! -e build/protocyte-prefix/share/protocyte/python/src/protocyte.egg-info

  find-package-windows:
    name: Find Package Windows
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Install prebuilt protoc
        id: protoc
        run: python .github/scripts/install_protoc.py --dest "${{ runner.temp }}/protoc"

      - name: Configure protocyte install tree
        run: cmake -S . -B build/protocyte-install -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Install protocyte package
        run: cmake --install build/protocyte-install --prefix build/protocyte-prefix

      - name: Configure find_package integration test
        run: >
          cmake -S tests/find_package -B tests/find_package/build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH=${{ github.workspace }}/build/protocyte-prefix
          -DProtobuf_PROTOC_EXECUTABLE=${{ steps.protoc.outputs.protoc }}

      - name: Build find_package integration test
        run: cmake --build tests/find_package/build

      - name: Run find_package integration test
        run: ctest --test-dir tests/find_package/build --output-on-failure

  hell-linux:
    name: Hell Linux
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Sync dependencies
        run: uv sync --locked --group dev

      - name: Install prebuilt protoc
        id: protoc
        run: python .github/scripts/install_protoc.py --dest "${{ runner.temp }}/protoc"

      - name: Install hell
        working-directory: tests/hell
        run: |
          npm ci
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Run hell integration test
        env:
          PROTOCYTE_CI_PROTOC_EXECUTABLE: ${{ steps.protoc.outputs.protoc }}
        run: uv run python tests/hell/run_ci.py

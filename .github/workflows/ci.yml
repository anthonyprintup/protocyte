name: CI

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Exact source revision tested by a release caller
        required: false
        type: string
        default: ""
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: CI-${{ inputs.checkout_ref || github.ref }}
  cancel-in-progress: true

jobs:
  private-path-guard:
    name: Private Path Guard
    runs-on: ubuntu-latest

    steps:
      - name: Check out complete repository history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Reject private absolute paths
        run: python .github/scripts/check_private_paths.py

  protobuf-fallback:
    name: Protobuf Fallback
    uses: ./.github/workflows/protobuf-fallback.yml
    with:
      checkout_ref: ${{ inputs.checkout_ref || github.sha }}

  protobuf-floor:
    name: Protobuf Floor
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - name: Install the public protobuf floor outside the lockfile
        run: |
          uv venv build/protobuf-floor-venv --python 3.12
          uv pip install --python build/protobuf-floor-venv/bin/python --no-deps .
          uv pip install --python build/protobuf-floor-venv/bin/python "protobuf==6.30.0" "pytest==8.4.2"
          build/protobuf-floor-venv/bin/python -c 'import google.protobuf; assert google.protobuf.__version__ == "6.30.0"'

      - name: Generate with the protobuf floor (upb)
        env:
          PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: upb
          PROTOCYTE_EXPECTED_PROTOBUF_VERSION: "6.30.0"
        run: build/protobuf-floor-venv/bin/python -m pytest -q tests/test_protobuf_floor.py

      - name: Generate with the protobuf floor (pure Python)
        env:
          PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
          PROTOCYTE_EXPECTED_PROTOBUF_VERSION: "6.30.0"
        run: build/protobuf-floor-venv/bin/python -m pytest -q tests/test_protobuf_floor.py

  plugin:
    name: Plugin
    uses: ./.github/workflows/plugin.yml
    with:
      checkout_ref: ${{ inputs.checkout_ref || github.sha }}

  quickstart:
    name: Quick Start
    uses: ./.github/workflows/quickstart.yml
    with:
      checkout_ref: ${{ inputs.checkout_ref || github.sha }}

  smoke:
    name: Smoke
    uses: ./.github/workflows/smoke.yml
    with:
      checkout_ref: ${{ inputs.checkout_ref || github.sha }}

  cmake-integration:
    name: CMake Integration
    uses: ./.github/workflows/cmake-integration.yml
    with:
      checkout_ref: ${{ inputs.checkout_ref || github.sha }}

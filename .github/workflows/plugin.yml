name: Plugin

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Exact source revision tested by the caller
        required: false
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --group dev

      - name: Install prebuilt protoc for required CMake integrations
        if: matrix.python-version == '3.12'
        id: integration-protoc
        run: python .github/scripts/install_protoc.py --dest "${{ runner.temp }}/protoc"

      - name: Lint Python sources
        run: uv run ruff check src tests

      - name: Build plugin package
        run: uv build

      - name: Run plugin tests
        env:
          PROTOCYTE_CI_PROTOC_EXECUTABLE: ${{ steps.integration-protoc.outputs.protoc }}
          PROTOCYTE_CI_REQUIRE_REAL_PROTOC_TESTS: ${{ matrix.python-version == '3.12' && '1' || '0' }}
        run: uv run pytest -q

      - name: Run CMake integration tests
        if: matrix.python-version == '3.12'
        env:
          PROTOCYTE_CI_PROTOC_EXECUTABLE: ${{ steps.integration-protoc.outputs.protoc }}
          PROTOCYTE_CI_REQUIRE_REAL_PROTOC_TESTS: "1"
        run: uv run pytest -q -m cmake_integration -n 4 --dist worksteal

name: Publish Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vX.Y.Z or vX.Y.Z-rcN)
        required: true
        type: string

permissions:
  contents: none

concurrency:
  # GitHub has no conditional/atomic asset-set publication operation. Serialize
  # the complete transaction across every release tag in this repository.
  group: protocyte-release-publication-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  validate-tag:
    name: Validate Release Tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      target: ${{ steps.version.outputs.target }}
      version: ${{ steps.version.outputs.version }}
      archive_name: ${{ steps.version.outputs.archive_name }}
      wheel_name: ${{ steps.version.outputs.wheel_name }}
      sdist_name: ${{ steps.version.outputs.sdist_name }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the live default-branch workflow revision
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Release workflow must be dispatched from refs/heads/main." >&2
            exit 1
          fi
          main_ref="refs/remotes/origin/main"
          workflow_target="$(git rev-parse --verify "HEAD^{commit}")"
          fetched_main="$(git rev-parse --verify "${main_ref}^{commit}")"
          if [[ "$workflow_target" != "$GITHUB_SHA" || \
                "$fetched_main" != "$GITHUB_SHA" ]]; then
            echo "Release workflow is not running the fetched main revision." >&2
            exit 1
          fi

      - name: Compare tag and package version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          tag="$RELEASE_TAG"
          version="${tag#v}"
          if [[ "$tag" == "$version" ]]; then
            echo "Release tags must start with 'v': $tag" >&2
            exit 1
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]; then
            echo "Release tags must use vX.Y.Z or prerelease vX.Y.Z-rcN format: $tag" >&2
            exit 1
          fi

          tag_ref="refs/tags/$tag"
          target="$(git rev-parse --verify "${tag_ref}^{commit}")"
          main_ref="refs/remotes/origin/main"
          git merge-base --is-ancestor "$target" "$main_ref"

          package_version="$(git show "${target}:src/protocyte/__init__.py" | grep -E '^__version__ = "[^"]+"' | sed -E 's/^__version__ = "([^"]+)"/\1/')"
          if [[ -z "$package_version" ]]; then
            echo "Failed to read package version from src/protocyte/__init__.py" >&2
            exit 1
          fi

          expected_package_version="${version/-rc/rc}"
          if [[ "$expected_package_version" != "$package_version" ]]; then
            echo "Tag version $version does not match package version $package_version" >&2
            exit 1
          fi

          prerelease=false
          if [[ "$version" == *-rc* ]]; then
            prerelease=true
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "archive_name=protocyte-${version}-cmake-prefix.tar.gz" >> "$GITHUB_OUTPUT"
          echo "wheel_name=protocyte-${expected_package_version}-py3-none-any.whl" >> "$GITHUB_OUTPUT"
          echo "sdist_name=protocyte-${expected_package_version}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  release-policy:
    name: Preflight Immutable Release Policy
    needs: validate-tag
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read

    steps:
      - name: Check out trusted policy code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Require trusted single-writer release policy before build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROTOCYTE_RELEASE_POLICY_TOKEN: ${{ secrets.RELEASE_POLICY_AUDIT_TOKEN }}
          RELEASE_TAG_RULESET_ID: ${{ vars.RELEASE_TAG_RULESET_ID }}
          LEGACY_RELEASE_WORKFLOW_ID: ${{ vars.LEGACY_RELEASE_WORKFLOW_ID }}
        run: |
          if [[ -z "$PROTOCYTE_RELEASE_POLICY_TOKEN" ]]; then
            echo "The release environment must define RELEASE_POLICY_AUDIT_TOKEN." >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG_RULESET_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "The release environment must define numeric RELEASE_TAG_RULESET_ID." >&2
            exit 1
          fi
          if [[ ! "$LEGACY_RELEASE_WORKFLOW_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "The release environment must define numeric LEGACY_RELEASE_WORKFLOW_ID." >&2
            exit 1
          fi
          python .github/scripts/check_release_policy.py \
            --repository "$GITHUB_REPOSITORY" \
            --environment release \
            --default-branch main \
            --workflow-ref "$GITHUB_REF" \
            --workflow-target "$GITHUB_SHA" \
            --tag-ruleset-id "$RELEASE_TAG_RULESET_ID" \
            --legacy-workflow-id "$LEGACY_RELEASE_WORKFLOW_ID" \
            --repository-root "$GITHUB_WORKSPACE"

  release-gate:
    name: Release Gate
    needs:
      - validate-tag
      - release-policy
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      checkout_ref: ${{ needs.validate-tag.outputs.target }}

  build-release:
    name: Build And Upload Release Artifacts
    needs:
      - validate-tag
      - release-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.release-handoff.outputs.artifact-id }}
      artifact_digest: ${{ steps.release-handoff.outputs.artifact-digest }}
    env:
      CMAKE_VERSION: "4.3.2"
      LC_ALL: C.UTF-8
      PYTHONHASHSEED: "0"
      TZ: UTC
      UV_PYTHON: "3.12.9"

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.validate-tag.outputs.target }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.9"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          version: "0.11.7"

      - name: Set normalized release timestamp
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Sync dependencies
        run: uv sync --locked --group dev

      - name: Prepare hash-locked release build tools
        shell: bash
        run: |
          tools_root="$PWD/staging/release-tools"
          constraints="$PWD/protocyte-cmake-constraints.txt"
          cmake_constraints="$PWD/.github/release-cmake-constraints.txt"
          tool_wheelhouse="$tools_root/wheelhouse"

          locked_cmake_version="$(
            sed -nE 's/^cmake==([^[:space:]\\]+).*/\1/p' "$cmake_constraints"
          )"
          if [[ "$locked_cmake_version" != "$CMAKE_VERSION" ]]; then
            echo "Release CMake lock version $locked_cmake_version does not match $CMAKE_VERSION." >&2
            exit 1
          fi

          bootstrap_python="$tools_root/bootstrap-venv/bin/python"
          uv venv "$tools_root/bootstrap-venv" --python 3.12
          uv pip install \
            --python "$bootstrap_python" \
            --no-deps \
            --only-binary=:all: \
            --require-hashes \
            --requirement "$constraints"
          "$bootstrap_python" -I -m pip --isolated download \
            --disable-pip-version-check \
            --no-input \
            --no-deps \
            --only-binary=:all: \
            --require-hashes \
            --requirement "$cmake_constraints" \
            --dest "$tool_wheelhouse"

          uv venv "$tools_root/cmake-venv" --python 3.12
          uv pip install \
            --python "$tools_root/cmake-venv/bin/python" \
            --no-index \
            --find-links "$tool_wheelhouse" \
            --no-deps \
            --only-binary=:all: \
            --require-hashes \
            --requirement "$cmake_constraints"
          echo "RELEASE_CMAKE=$tools_root/cmake-venv/bin/cmake" >> "$GITHUB_ENV"
          echo "RELEASE_CTEST=$tools_root/cmake-venv/bin/ctest" >> "$GITHUB_ENV"
          chmod -R a-w "$tool_wheelhouse"

      - name: Build and normalize plugin packages twice
        shell: bash
        run: |
          for build in first second; do
            source_dir="staging/reproducibility/${build}/source"
            output_dir="staging/reproducibility/${build}/dist"
            mkdir -p "$source_dir"
            git archive HEAD | tar -x -C "$source_dir"
            uv build "$source_dir" \
              --out-dir "$output_dir" \
              --python "$PWD/staging/release-tools/bootstrap-venv/bin/python" \
              --no-build-isolation \
              --no-index \
              --offline
            "$PWD/.venv/bin/python" .github/scripts/reproducible_archive.py \
              --epoch "$SOURCE_DATE_EPOCH" normalize zip \
              "$output_dir/${{ needs.validate-tag.outputs.wheel_name }}"
            "$PWD/.venv/bin/python" .github/scripts/reproducible_archive.py \
              --epoch "$SOURCE_DATE_EPOCH" normalize tar-gz \
              "$output_dir/${{ needs.validate-tag.outputs.sdist_name }}"
          done

          cmp \
            "staging/reproducibility/first/dist/${{ needs.validate-tag.outputs.wheel_name }}" \
            "staging/reproducibility/second/dist/${{ needs.validate-tag.outputs.wheel_name }}"
          cmp \
            "staging/reproducibility/first/dist/${{ needs.validate-tag.outputs.sdist_name }}" \
            "staging/reproducibility/second/dist/${{ needs.validate-tag.outputs.sdist_name }}"

          mkdir -p dist
          cp \
            "staging/reproducibility/first/dist/${{ needs.validate-tag.outputs.wheel_name }}" \
            "dist/${{ needs.validate-tag.outputs.wheel_name }}"
          cp \
            "staging/reproducibility/first/dist/${{ needs.validate-tag.outputs.sdist_name }}" \
            "dist/${{ needs.validate-tag.outputs.sdist_name }}"

      - name: Build and normalize CMake prefix twice
        shell: bash
        run: |
          version="${{ needs.validate-tag.outputs.version }}"
          prefix_name="protocyte-${version}-cmake-prefix"
          for build in first second; do
            build_root="staging/reproducibility/${build}"
            source_dir="${build_root}/source"
            prefix_dir="${build_root}/${prefix_name}"
            "$RELEASE_CMAKE" \
              -S "$source_dir" -B "${build_root}/cmake-build"
            "$RELEASE_CMAKE" \
              --install "${build_root}/cmake-build" --prefix "$prefix_dir"
            "$PWD/.venv/bin/python" .github/scripts/reproducible_archive.py \
              --epoch "$SOURCE_DATE_EPOCH" pack-tar-gz "$prefix_dir" \
              "${build_root}/${{ needs.validate-tag.outputs.archive_name }}"
          done

          cmp \
            "staging/reproducibility/first/${{ needs.validate-tag.outputs.archive_name }}" \
            "staging/reproducibility/second/${{ needs.validate-tag.outputs.archive_name }}"
          cp \
            "staging/reproducibility/first/${{ needs.validate-tag.outputs.archive_name }}" \
            "staging/${{ needs.validate-tag.outputs.archive_name }}"

      - name: Stage exact publication handoff
        shell: bash
        run: |
          handoff="staging/release-handoff"
          mkdir -p "$handoff"
          cp \
            "dist/${{ needs.validate-tag.outputs.wheel_name }}" \
            "$handoff/${{ needs.validate-tag.outputs.wheel_name }}"
          cp \
            "dist/${{ needs.validate-tag.outputs.sdist_name }}" \
            "$handoff/${{ needs.validate-tag.outputs.sdist_name }}"
          cp \
            "staging/${{ needs.validate-tag.outputs.archive_name }}" \
            "$handoff/${{ needs.validate-tag.outputs.archive_name }}"

          (
            cd "$handoff"
            sha256sum \
              "${{ needs.validate-tag.outputs.wheel_name }}" \
              "${{ needs.validate-tag.outputs.sdist_name }}" \
              "${{ needs.validate-tag.outputs.archive_name }}" \
              > SHA256SUMS
            sha256sum --check --strict SHA256SUMS
          )

      - name: Upload exact publication handoff
        id: release-handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: protocyte-release-${{ github.run_id }}-${{ github.sha }}
          path: |
            staging/release-handoff/SHA256SUMS
            staging/release-handoff/${{ needs.validate-tag.outputs.wheel_name }}
            staging/release-handoff/${{ needs.validate-tag.outputs.sdist_name }}
            staging/release-handoff/${{ needs.validate-tag.outputs.archive_name }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  smoke-python-artifacts:
    name: Smoke ${{ matrix.artifact_kind }} Artifact
    needs:
      - validate-tag
      - build-release
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        artifact_kind:
          - wheel
          - sdist
    env:
      CMAKE_VERSION: "4.3.2"
      LC_ALL: C.UTF-8
      UV_PYTHON: "3.12.9"

    steps:
      - name: Check out release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.validate-tag.outputs.target }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.9"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          version: "0.11.7"

      - name: Install prebuilt protoc for release artifact test
        id: release-protoc
        run: python .github/scripts/install_protoc.py --dest "$RUNNER_TEMP/protoc"

      - name: Prepare hash-locked release smoke tools and environment
        shell: bash
        run: |
          tools_root="$PWD/staging/release-tools"
          smoke_root="$PWD/staging/release-tests/${{ matrix.artifact_kind }}"
          constraints="$PWD/protocyte-cmake-constraints.txt"
          cmake_constraints="$PWD/.github/release-cmake-constraints.txt"
          wheelhouse="$PWD/staging/release-tests/wheelhouse"
          tool_wheelhouse="$tools_root/wheelhouse"

          locked_cmake_version="$(
            sed -nE 's/^cmake==([^[:space:]\\]+).*/\1/p' "$cmake_constraints"
          )"
          if [[ "$locked_cmake_version" != "$CMAKE_VERSION" ]]; then
            echo "Release CMake lock version $locked_cmake_version does not match $CMAKE_VERSION." >&2
            exit 1
          fi

          bootstrap_python="$tools_root/bootstrap-venv/bin/python"
          uv venv "$tools_root/bootstrap-venv" --python 3.12
          uv pip install \
            --python "$bootstrap_python" \
            --no-deps \
            --only-binary=:all: \
            --require-hashes \
            --requirement "$constraints"
          "$bootstrap_python" -I -m pip --isolated download \
            --disable-pip-version-check \
            --no-input \
            --no-deps \
            --only-binary=:all: \
            --require-hashes \
            --requirement "$constraints" \
            --dest "$wheelhouse"
          "$bootstrap_python" -I -m pip --isolated download \
            --disable-pip-version-check \
            --no-input \
            --no-deps \
            --only-binary=:all: \
            --require-hashes \
            --requirement "$cmake_constraints" \
            --dest "$tool_wheelhouse"

          uv venv "$tools_root/cmake-venv" --python 3.12
          uv pip install \
            --python "$tools_root/cmake-venv/bin/python" \
            --no-index \
            --find-links "$tool_wheelhouse" \
            --no-deps \
            --only-binary=:all: \
            --require-hashes \
            --requirement "$cmake_constraints"
          echo "RELEASE_CMAKE=$tools_root/cmake-venv/bin/cmake" >> "$GITHUB_ENV"
          echo "RELEASE_CTEST=$tools_root/cmake-venv/bin/ctest" >> "$GITHUB_ENV"

          artifact_python="$smoke_root/venv/bin/python"
          uv venv "$smoke_root/venv" --python 3.12
          uv pip install \
            --python "$artifact_python" \
            --no-index \
            --find-links "$wheelhouse" \
            --no-deps \
            --only-binary=:all: \
            --require-hashes \
            --requirement "$constraints"
          chmod -R a-w "$wheelhouse" "$tool_wheelhouse"

      - name: Download and verify exact immutable release handoff
        shell: bash
        env:
          ARCHIVE_NAME: ${{ needs.validate-tag.outputs.archive_name }}
          ARTIFACT_ID: ${{ needs.build-release.outputs.artifact_id }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.build-release.outputs.artifact_digest }}
          EXPECTED_ARTIFACT_NAME: protocyte-release-${{ github.run_id }}-${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          SDIST_NAME: ${{ needs.validate-tag.outputs.sdist_name }}
          WHEEL_NAME: ${{ needs.validate-tag.outputs.wheel_name }}
        run: |
          python -I .github/scripts/download_release_handoff.py \
            --api-url "$GITHUB_API_URL" \
            --repository "$GITHUB_REPOSITORY" \
            --artifact-id "$ARTIFACT_ID" \
            --artifact-name "$EXPECTED_ARTIFACT_NAME" \
            --artifact-digest "$EXPECTED_ARTIFACT_DIGEST" \
            --run-id "$GITHUB_RUN_ID" \
            --head-sha "$GITHUB_SHA" \
            --destination "$RUNNER_TEMP/release-handoff" \
            --wheel "$WHEEL_NAME" \
            --sdist "$SDIST_NAME" \
            --archive "$ARCHIVE_NAME"

      - name: Test exact Python artifact
        shell: bash
        env:
          SDIST_NAME: ${{ needs.validate-tag.outputs.sdist_name }}
          WHEEL_NAME: ${{ needs.validate-tag.outputs.wheel_name }}
        run: |
          case "${{ matrix.artifact_kind }}" in
            wheel) artifact_name="$WHEEL_NAME" ;;
            sdist) artifact_name="$SDIST_NAME" ;;
            *) echo "Unexpected artifact kind." >&2; exit 1 ;;
          esac
          python .github/scripts/test_release_plugin_artifact.py \
            --artifact "$RUNNER_TEMP/release-handoff/$artifact_name" \
            --cmake "$RELEASE_CMAKE" \
            --ctest "$RELEASE_CTEST" \
            --protoc "${{ steps.release-protoc.outputs.protoc }}" \
            --test-root "staging/release-tests/${{ matrix.artifact_kind }}"

  smoke-cmake-prefix:
    name: Smoke CMake Prefix Artifact
    needs:
      - validate-tag
      - build-release
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      CMAKE_VERSION: "4.3.2"
      LC_ALL: C.UTF-8
      UV_PYTHON: "3.12.9"

    steps:
      - name: Check out release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.validate-tag.outputs.target }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.9"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          version: "0.11.7"

      - name: Install prebuilt protoc for release artifact test
        id: release-protoc
        run: python .github/scripts/install_protoc.py --dest "$RUNNER_TEMP/protoc"

      - name: Prepare hash-locked release smoke tools and wheelhouse
        shell: bash
        run: |
          tools_root="$PWD/staging/release-tools"
          constraints="$PWD/protocyte-cmake-constraints.txt"
          cmake_constraints="$PWD/.github/release-cmake-constraints.txt"
          wheelhouse="$PWD/staging/release-tests/wheelhouse"
          tool_wheelhouse="$tools_root/wheelhouse"

          locked_cmake_version="$(
            sed -nE 's/^cmake==([^[:space:]\\]+).*/\1/p' "$cmake_constraints"
          )"
          if [[ "$locked_cmake_version" != "$CMAKE_VERSION" ]]; then
            echo "Release CMake lock version $locked_cmake_version does not match $CMAKE_VERSION." >&2
            exit 1
          fi

          bootstrap_python="$tools_root/bootstrap-venv/bin/python"
          uv venv "$tools_root/bootstrap-venv" --python 3.12
          uv pip install \
            --python "$bootstrap_python" \
            --no-deps \
            --only-binary=:all: \
            --require-hashes \
            --requirement "$constraints"
          "$bootstrap_python" -I -m pip --isolated download \
            --disable-pip-version-check \
            --no-input \
            --no-deps \
            --only-binary=:all: \
            --require-hashes \
            --requirement "$constraints" \
            --dest "$wheelhouse"
          "$bootstrap_python" -I -m pip --isolated download \
            --disable-pip-version-check \
            --no-input \
            --no-deps \
            --only-binary=:all: \
            --require-hashes \
            --requirement "$cmake_constraints" \
            --dest "$tool_wheelhouse"

          uv venv "$tools_root/cmake-venv" --python 3.12
          uv pip install \
            --python "$tools_root/cmake-venv/bin/python" \
            --no-index \
            --find-links "$tool_wheelhouse" \
            --no-deps \
            --only-binary=:all: \
            --require-hashes \
            --requirement "$cmake_constraints"
          echo "RELEASE_CMAKE=$tools_root/cmake-venv/bin/cmake" >> "$GITHUB_ENV"
          echo "RELEASE_CTEST=$tools_root/cmake-venv/bin/ctest" >> "$GITHUB_ENV"
          chmod -R a-w "$wheelhouse" "$tool_wheelhouse"

      - name: Download and verify exact immutable release handoff
        shell: bash
        env:
          ARCHIVE_NAME: ${{ needs.validate-tag.outputs.archive_name }}
          ARTIFACT_ID: ${{ needs.build-release.outputs.artifact_id }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.build-release.outputs.artifact_digest }}
          EXPECTED_ARTIFACT_NAME: protocyte-release-${{ github.run_id }}-${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          SDIST_NAME: ${{ needs.validate-tag.outputs.sdist_name }}
          WHEEL_NAME: ${{ needs.validate-tag.outputs.wheel_name }}
        run: |
          python -I .github/scripts/download_release_handoff.py \
            --api-url "$GITHUB_API_URL" \
            --repository "$GITHUB_REPOSITORY" \
            --artifact-id "$ARTIFACT_ID" \
            --artifact-name "$EXPECTED_ARTIFACT_NAME" \
            --artifact-digest "$EXPECTED_ARTIFACT_DIGEST" \
            --run-id "$GITHUB_RUN_ID" \
            --head-sha "$GITHUB_SHA" \
            --destination "$RUNNER_TEMP/release-handoff" \
            --wheel "$WHEEL_NAME" \
            --sdist "$SDIST_NAME" \
            --archive "$ARCHIVE_NAME"

      - name: Test exact CMake prefix artifact
        shell: bash
        env:
          PIP_CONFIG_FILE: /dev/null
          PIP_FIND_LINKS: ${{ github.workspace }}/staging/release-tests/wheelhouse
          PIP_NO_INDEX: "1"
          UV_NO_INDEX: "1"
          UV_OFFLINE: "1"
        run: |
          clean_environment=(
            env -i
            "HOME=$HOME"
            "PATH=$PATH"
            "LANG=$LANG"
            "LC_ALL=$LC_ALL"
            "TMPDIR=${TMPDIR:-$RUNNER_TEMP}"
            "PIP_CONFIG_FILE=$PIP_CONFIG_FILE"
            "PIP_FIND_LINKS=$PIP_FIND_LINKS"
            "PIP_NO_INDEX=$PIP_NO_INDEX"
            "UV_NO_INDEX=$UV_NO_INDEX"
            "UV_OFFLINE=$UV_OFFLINE"
          )
          mkdir -p staging/release-tests/cmake-prefix
          python -m tarfile -e \
            "$RUNNER_TEMP/release-handoff/${{ needs.validate-tag.outputs.archive_name }}" \
            staging/release-tests/cmake-prefix
          "${clean_environment[@]}" "$RELEASE_CMAKE" \
            -S tests/find_package \
            -B staging/release-tests/cmake-build \
            -DCMAKE_PREFIX_PATH="$PWD/staging/release-tests/cmake-prefix/protocyte-${{ needs.validate-tag.outputs.version }}-cmake-prefix" \
            "-DProtobuf_PROTOC_EXECUTABLE=${{ steps.release-protoc.outputs.protoc }}"
          "${clean_environment[@]}" "$RELEASE_CMAKE" \
            --build staging/release-tests/cmake-build
          "${clean_environment[@]}" "$RELEASE_CTEST" \
            --test-dir staging/release-tests/cmake-build --output-on-failure

  publish:
    name: Publish Immutable Release
    needs:
      - validate-tag
      - release-policy
      - release-gate
      - build-release
      - smoke-python-artifacts
      - smoke-cmake-prefix
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out trusted publication code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Download and verify exact immutable release handoff
        shell: bash
        env:
          ARCHIVE_NAME: ${{ needs.validate-tag.outputs.archive_name }}
          ARTIFACT_ID: ${{ needs.build-release.outputs.artifact_id }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.build-release.outputs.artifact_digest }}
          EXPECTED_ARTIFACT_NAME: protocyte-release-${{ github.run_id }}-${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          SDIST_NAME: ${{ needs.validate-tag.outputs.sdist_name }}
          WHEEL_NAME: ${{ needs.validate-tag.outputs.wheel_name }}
        run: |
          python -I .github/scripts/download_release_handoff.py \
            --api-url "$GITHUB_API_URL" \
            --repository "$GITHUB_REPOSITORY" \
            --artifact-id "$ARTIFACT_ID" \
            --artifact-name "$EXPECTED_ARTIFACT_NAME" \
            --artifact-digest "$EXPECTED_ARTIFACT_DIGEST" \
            --run-id "$GITHUB_RUN_ID" \
            --head-sha "$GITHUB_SHA" \
            --destination "$RUNNER_TEMP/release-handoff" \
            --wheel "$WHEEL_NAME" \
            --sdist "$SDIST_NAME" \
            --archive "$ARCHIVE_NAME"

      - name: Create, verify, and publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PROTOCYTE_RELEASE_POLICY_TOKEN: ${{ secrets.RELEASE_IMMUTABILITY_TOKEN }}
        shell: bash
        run: |
          python .github/scripts/publish_release.py \
            --repository "$GITHUB_REPOSITORY" \
            --tag "${{ needs.validate-tag.outputs.tag }}" \
            --target "${{ needs.validate-tag.outputs.target }}" \
            --trusted-branch main \
            --trusted-target "$GITHUB_SHA" \
            --prerelease "${{ needs.validate-tag.outputs.prerelease }}" \
            "$RUNNER_TEMP/release-handoff/${{ needs.validate-tag.outputs.wheel_name }}" \
            "$RUNNER_TEMP/release-handoff/${{ needs.validate-tag.outputs.sdist_name }}" \
            "$RUNNER_TEMP/release-handoff/${{ needs.validate-tag.outputs.archive_name }}"

name: CMake Integration

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Exact source revision tested by the caller
        required: false
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read

jobs:
  managed-python-windows:
    name: Managed Python ${{ matrix.python-version }} (Windows)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --group dev

      - name: Verify managed provisioning, nested reuse, and diagnostics
        run: >
          uv run pytest -q -m cmake_integration
          tests/test_cmake.py::test_managed_host_tools_support_nested_reuse_and_stage_specific_diagnostics

  fetchcontent-linux:
    name: FetchContent (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install prebuilt protoc
        id: protoc
        run: python .github/scripts/install_protoc.py --dest "${{ runner.temp }}/protoc"

      - name: Configure FetchContent integration test
        run: >
          cmake -S tests/fetchcontent -B tests/fetchcontent/build
          -DProtobuf_PROTOC_EXECUTABLE=${{ steps.protoc.outputs.protoc }}

      - name: Build FetchContent integration test
        run: cmake --build tests/fetchcontent/build

      - name: Run FetchContent integration test
        run: ctest --test-dir tests/fetchcontent/build --output-on-failure

      - name: Install FetchContent consumer
        run: >
          cmake --install tests/fetchcontent/build
          --prefix tests/fetchcontent/install

      - name: Verify FetchContent install isolation
        run: |
          test -f tests/fetchcontent/install/share/protocyte-integration/fetchcontent-consumer.txt
          test "$(awk 'END { print NR }' tests/fetchcontent/build/install_manifest.txt)" -eq 1
          test ! -e tests/fetchcontent/install/include/protocyte
          test ! -e tests/fetchcontent/install/lib/cmake/protocyte
          test ! -e tests/fetchcontent/install/share/protocyte

  find-package-linux:
    name: Find Package (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install prebuilt protoc
        id: protoc
        run: python .github/scripts/install_protoc.py --dest "${{ runner.temp }}/protoc"

      - name: Configure protocyte install tree
        run: cmake -S . -B build/protocyte-install

      - name: Install protocyte package
        run: cmake --install build/protocyte-install --prefix build/protocyte-prefix

      - name: Make installed prefix read-only
        run: chmod -R a-w build/protocyte-prefix

      - name: Configure find_package integration test
        run: >
          cmake -S tests/find_package -B tests/find_package/build
          -DCMAKE_PREFIX_PATH=${{ github.workspace }}/build/protocyte-prefix
          -DProtobuf_PROTOC_EXECUTABLE=${{ steps.protoc.outputs.protoc }}

      - name: Build find_package integration test
        run: cmake --build tests/find_package/build

      - name: Run find_package integration test
        run: ctest --test-dir tests/find_package/build --output-on-failure

      - name: Verify provisioning did not modify the installed prefix
        run: |
          test ! -e build/protocyte-prefix/share/protocyte/python/build
          test ! -e build/protocyte-prefix/share/protocyte/python/src/protocyte.egg-info

  find-package-windows:
    name: Find Package (Windows)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Install prebuilt protoc
        id: protoc
        run: python .github/scripts/install_protoc.py --dest "${{ runner.temp }}/protoc"

      - name: Configure protocyte install tree
        run: cmake -S . -B build/protocyte-install -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Install protocyte package
        run: cmake --install build/protocyte-install --prefix build/protocyte-prefix

      - name: Configure find_package integration test
        run: >
          cmake -S tests/find_package -B tests/find_package/build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH=${{ github.workspace }}/build/protocyte-prefix
          -DProtobuf_PROTOC_EXECUTABLE=${{ steps.protoc.outputs.protoc }}

      - name: Build find_package integration test
        run: cmake --build tests/find_package/build

      - name: Run find_package integration test
        run: ctest --test-dir tests/find_package/build --output-on-failure

  find-package-macos:
    name: Find Package (macOS)
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install prebuilt protoc
        id: protoc
        run: python .github/scripts/install_protoc.py --dest "${{ runner.temp }}/protoc"

      - name: Configure protocyte install tree
        run: cmake -S . -B build/protocyte-install -DCMAKE_BUILD_TYPE=Release

      - name: Install protocyte package
        run: cmake --install build/protocyte-install --prefix build/protocyte-prefix

      - name: Make installed prefix read-only
        run: chmod -R a-w build/protocyte-prefix

      - name: Configure find_package integration test
        run: >
          cmake -S tests/find_package -B tests/find_package/build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH=${{ github.workspace }}/build/protocyte-prefix
          -DProtobuf_PROTOC_EXECUTABLE=${{ steps.protoc.outputs.protoc }}

      - name: Build find_package integration test
        run: cmake --build tests/find_package/build

      - name: Run find_package integration test
        run: ctest --test-dir tests/find_package/build --output-on-failure

      - name: Verify provisioning did not modify the installed prefix
        run: |
          test ! -e build/protocyte-prefix/share/protocyte/python/build
          test ! -e build/protocyte-prefix/share/protocyte/python/src/protocyte.egg-info

  hell-linux:
    name: Hell (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Sync dependencies
        run: uv sync --locked --group dev

      - name: Install prebuilt protoc
        id: protoc
        run: python .github/scripts/install_protoc.py --dest "${{ runner.temp }}/protoc"

      - name: Install hell
        working-directory: tests/hell
        run: |
          npm ci
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Run hell integration test
        env:
          PROTOCYTE_CI_PROTOC_EXECUTABLE: ${{ steps.protoc.outputs.protoc }}
        run: uv run python tests/hell/run_ci.py

  visual-studio-incremental:
    name: Visual Studio Codegen Incremental
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --group dev

      - name: Set up MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Install prebuilt protoc
        id: visual-studio-protoc
        run: python .github/scripts/install_protoc.py --dest "${{ runner.temp }}/protoc"

      - name: Verify Visual Studio configure, build, no-op, and rebuild
        env:
          PROTOCYTE_CI_PROTOC_EXECUTABLE: ${{ steps.visual-studio-protoc.outputs.protoc }}
          PROTOCYTE_CI_REQUIRE_REAL_PROTOC_TESTS: "1"
          PROTOCYTE_CI_REQUIRE_VISUAL_STUDIO_TEST: "1"
          PROTOCYTE_CI_VISUAL_STUDIO_TEST_ROOT: ${{ github.workspace }}/build/visual-studio-incremental
        run: >
          uv run pytest -q -m cmake_integration
          tests/test_cmake.py::test_visual_studio_codegen_builds_noop_and_rebuilds_transitive_import
          "tests/test_cmake.py::test_source_codegen_tracks_import_shadow_addition_and_removal[visual-studio]"
          "tests/test_cmake.py::test_source_codegen_tracks_import_directory_identity_changes[visual-studio]"
          "tests/test_cmake.py::test_source_codegen_tracks_import_directory_identity_changes[nmake]"

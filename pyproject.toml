[project]
name = "protocyte"
dynamic = ["version"]
requires-python = ">=3.12"
dependencies = [
    "protobuf>=6.30.0",
]

[project.scripts]
protoc-gen-protocyte = "protocyte.main:main"

[dependency-groups]
dev = [
    "clang-format==22.1.4",
    "pytest>=8.0.0",
    "ruff>=0.11.0",
]

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "protocyte.__version__"}

[tool.setuptools.package-data]
protocyte = ["proto/**/*.proto"]
"protocyte.runtime" = ["*.hpp"]

[tool.pytest.ini_options]
addopts = '-m "not cmake_integration"'
markers = [
    "cmake_integration: slow tests that configure or build temporary CMake projects",
]
testpaths = ["tests"]
norecursedirs = [
    ".git",
    ".venv",
    ".uv-cache",
    "build",
    "dist",
    "tests/smoke/build",
    "tests/smoke/cmake-build-debug",
]
